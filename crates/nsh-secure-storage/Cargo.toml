[package]
name = "nsh-secure-storage"
description = "Secure key-value storage for Native Shell apps, backed by each platform's own secret store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "nsh_secure_storage"
path = "src/lib.rs"

[dependencies]
nsh-core = "0.4.0"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
zeroize = "1.9.1"

# Apple's Keychain, on the two Apple OSes this crate supports. Each backend's
# dependencies sit under its own target table, so other platforms do not build them.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
block2 = "0.6.2"

# Android's Keystore, over JNI. The store file and its JSON are plain Rust; the Keystore does the AES.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
libc = "0.2.191"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The web backend: WebCrypto and IndexedDB, on the wasm32 target only. The versions are the ones
# NSH 0.4.0 links, because `nsh` runs the wasm-bindgen CLI of the same version (docs/decisions.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "AesGcmParams",
    "AesKeyGenParams",
    "Crypto",
    "CryptoKey",
    "DomException",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "SubtleCrypto",
    "Window",
    "console",
] }

[dev-dependencies]
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", default-features = false }
# Gives the Keychain tests the blocking pool that `nsh_core::blocking` uses inside an engine.
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
# The host tests run the Android store logic against a fake Keystore that really seals with AES-GCM.
aes-gcm = "0.11.1"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The Windows and Linux backends and their mock-store tests build on every host, so these are not
# target-gated. wasm32 has no entropy source here, and the web backend has its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

# Credential Manager, and the Win32 call that reads the app's identity (its AppUserModelID).
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# The Secret Service. The sync API runs on any thread, so it uses async-io, not a tokio handle.
# `secret-service` is named so its errors can be told apart (locked, no service, prompt dismissed).
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "5.2.0"
zbus = "5.19.0"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
